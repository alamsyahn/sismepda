# Overlay produksi: sambungkan app ke edge proxy bersama (edge-caddy-1).
# Dipakai bersama compose.yaml:
#   COMPOSE_FILE=compose.yaml:compose.edge.yaml
#
# Stack ini TIDAK mengikat port 80/443 di host; TLS dan routing ditangani
# edge-caddy-1. Database tetap internal-only (tanpa port publish).
#
# Alias "sismepda-new-app" sengaja berbeda dari "sismepda-app" milik deployment
# lama agar keduanya bisa hidup berdampingan selama masa transisi.
services:
  app:
    networks:
      edge:
        aliases:
          - sismepda-new-app

networks:
  edge:
    external: true
    name: edge
