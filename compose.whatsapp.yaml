# Overlay produksi: worker WhatsApp otomatis.
#
# MENGAPA FILE TERPISAH
#
# Alasannya sama dengan `compose.media.yaml`: `deploy.yaml` hidup di host
# produksi dan tidak di-track Git, sehingga menyuntikkan service ke sana berarti
# menyunting produksi dengan tangan — tidak terlacak, tidak tertinjau, tidak
# teruji. Overlay ini berada di Git dan sampai ke produksi lewat `git merge
# --ff-only` yang sudah dilakukan alur deploy:
#
#   docker compose -f deploy.yaml -f compose.media.yaml -f compose.whatsapp.yaml ...
#
# MENGAPA SERVICE TERPISAH, BUKAN DI DALAM APP
#
# Baileys memerlukan WebSocket long-lived. Menjalankannya di dalam proses
# Next.js berarti koneksi WhatsApp ikut mati dan hidup setiap kali aplikasi
# di-deploy ulang, dan setiap instance akan membuka soketnya sendiri. WhatsApp
# menanggapi pola itu dengan memblokir akun.

services:
  whatsapp-worker:
    build:
      context: .
      # Worker menjalankan TypeScript lewat tsx, dan stage `migrator` sudah
      # berisi sumber, node_modules, serta tsconfig untuk keperluan itu.
      # Stage `runner` adalah build standalone Next tanpa tsx.
      target: migrator
    restart: unless-stopped
    # Berkas worker berekstensi `.mts` dan itu WAJIB: Baileys 7 bergantung pada
    # `whatsapp-rust-bridge` yang ESM-only, sehingga varian `.ts` membuat tsx
    # memuat rantai impor sebagai CommonJS dan worker mati saat start dengan
    # ERR_PACKAGE_PATH_NOT_EXPORTED. Jangan kembalikan ke `.ts`.
    command: ["sh", "-c", "npx tsx scripts/whatsapp-worker.mts"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Sesi Baileys di dalam container. Harus sama persis dengan titik mount
      # di bawah, atau sesi akan ditulis ke writable layer dan hilang setiap
      # kali container dibuat ulang — memaksa pemindaian QR pada tiap deploy.
      WHATSAPP_SESSION_DIR: /app/whatsapp-session
      WHATSAPP_WORKER_PORT: "3100"
      # Token bersama antara app dan worker. Tanpa ini worker menolak start:
      # lihat scripts/whatsapp-worker.mts.
      WHATSAPP_WORKER_TOKEN: ${WHATSAPP_WORKER_TOKEN}
    volumes:
      - whatsapp_session:/app/whatsapp-session
    # TIDAK ADA `ports:`. Worker hanya dijangkau app lewat jaringan internal
    # Docker; mengeksposnya ke host berarti membuka kendali akun WhatsApp
    # sekolah ke internet.
    #
    # DUA JARINGAN, DAN KEDUANYA WAJIB:
    #
    #   database → menjangkau PostgreSQL, dan dijangkau app lewat nama service.
    #   whatsapp_egress → satu-satunya jalan keluar ke internet.
    #
    # Jaringan `database` produksi dibuat dengan `internal: true`, yang berarti
    # Docker TIDAK memasang default route maupun akses DNS keluar pada container
    # yang hanya tersambung ke sana. Worker yang hanya memakai `database` bisa
    # hidup, listen, dan bicara ke database, tetapi setiap resolusi nama keluar
    # gagal dengan EAI_AGAIN — termasuk web.whatsapp.com. Gejalanya menyesatkan:
    # Baileys gagal mengambil versi WA Web (jatuh ke versi bawaan, "terbaru:
    # tidak") lalu handshake ditutup dengan status 408 sebelum QR sempat terbit.
    #
    # Perbaikannya BUKAN menjadikan `database` non-internal: itu memberi jalur
    # internet kepada PostgreSQL juga. Worker mendapat jaringan bridge kedua
    # khusus untuk outbound.
    networks: [database, whatsapp_egress]

  app:
    environment:
      # Nama service di jaringan internal, bukan alamat publik.
      WHATSAPP_WORKER_URL: http://whatsapp-worker:3100
      WHATSAPP_WORKER_TOKEN: ${WHATSAPP_WORKER_TOKEN}

volumes:
  # Nama eksplisit, dengan alasan yang sama seperti volume media: tanpa `name:`
  # Docker menurunkannya dari nama project, sehingga perubahan nama project
  # diam-diam membuat volume BARU yang kosong — dan sesi WhatsApp yang lama
  # tetap ada di disk tetapi tidak lagi ter-mount, memaksa pairing ulang.
  #
  # Isi volume ini adalah KREDENSIAL: siapa pun yang membacanya dapat mengirim
  # pesan sebagai akun sekolah. Ia juga bukan bagian dari dump PostgreSQL,
  # sehingga backup database saja tidak memulihkannya.
  whatsapp_session:
    name: sismepda_whatsapp_session

networks:
  # Jaringan bridge biasa — sengaja TIDAK `internal: true`, karena justru
  # ketiadaan egress-lah yang membuat Baileys tidak pernah mencapai WhatsApp.
  #
  # Ini tidak membuka apa pun ke arah masuk. Bridge Docker tanpa `ports:` hanya
  # memberi NAT keluar; tidak ada porta host yang terikat dan tidak ada rute
  # dari internet menuju worker. Yang bertambah hanyalah kemampuan worker
  # memulai koneksi keluar.
  #
  # Dipakai HANYA oleh worker. App tetap memakai proxy untuk trafik masuk, dan
  # PostgreSQL tetap sepenuhnya terkurung di jaringan `database` yang internal:
  # ia tidak tersambung ke sini, sehingga isolasinya tidak berubah sama sekali.
  #
  # Alternatif yang ditolak: menempelkan worker ke `sismepda_proxy`. Jaringan itu
  # ada untuk trafik masuk lewat reverse proxy; memakainya sebagai jalur keluar
  # menaruh worker satu segmen dengan permukaan yang menghadap publik tanpa
  # alasan. Jaringan khusus ini memberi egress tanpa kedekatan itu.
  #
  # Tanpa `name:`, Docker menamainya `<project>_whatsapp_egress`; di produksi
  # dengan project `sismepda` hasilnya `sismepda_whatsapp_egress`. Dibiarkan
  # diturunkan seperti itu karena jaringan ini tidak menyimpan state — berbeda
  # dari volume sesi, jaringan yang terbuat ulang tidak menghilangkan apa pun.
  whatsapp_egress:
    driver: bridge
