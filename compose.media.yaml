# Overlay produksi: penyimpanan media persisten.
#
# MENGAPA FILE TERPISAH
#
# `deploy.yaml` hidup di host produksi dan sengaja tidak di-track Git
# (`.git/info/exclude`), karena isinya disesuaikan per-mesin. Menyuntikkan
# konfigurasi media ke sana berarti menyunting produksi dengan tangan, dan
# hasilnya tidak terlacak, tidak tertinjau, dan tidak teruji.
#
# Overlay ini sebaliknya: ia berada di Git, ikut ter-review, dan sampai ke
# produksi lewat `git merge --ff-only` yang sudah dilakukan alur deploy. Docker
# Compose menggabungkannya di atas `deploy.yaml`:
#
#   docker compose -f deploy.yaml -f compose.media.yaml ...
#
# APA YANG DIJAMIN
#
# Media aplikasi TIDAK boleh tinggal di writable layer container. Layer itu
# dibuang setiap kali container dibuat ulang — dan `compose up -d app` memang
# membuat ulang container setiap deploy. Tanpa volume, setiap berkas yang
# diunggah sejak deploy terakhir akan hilang tanpa pesan kesalahan apa pun.
#
# Byte `bytea` legacy masih menjadi jaring pengaman untuk media LAMA, tetapi
# media yang diunggah setelah rollout hanya hidup di sini.

services:
  app:
    environment:
      # Akar penyimpanan media di dalam container. Nilai ini harus sama persis
      # dengan titik mount di bawah; keduanya diverifikasi `deploy:preflight`.
      MEDIA_STORAGE_ROOT: /app/media
    volumes:
      - media:/app/media

  # Migrator memakai VOLUME DAN AKAR YANG SAMA dengan app.
  #
  # Migrasi media legacy menulis berkas ke penyimpanan kanonik lalu memperbarui
  # referensi database. Bila migrator menulis ke tempat lain — volume terpisah
  # atau writable layer container — database produksi akan menunjuk kunci yang
  # tidak pernah bisa dibaca aplikasi, dan berkasnya hilang begitu container
  # sekali-jalan itu dibuang.
  #
  # Service ini ada di profil `migration`, jadi ia tidak pernah ikut
  # `compose up`; ia hanya hidup saat operator menjalankannya lewat
  # `compose run --rm`. Menambahkan mount di sini tidak mengubah apa pun pada
  # container yang sedang berjalan.
  migrate:
    # Jalankan sebagai pengguna runtime aplikasi (uid 1001), BUKAN root.
    # Migrator menulis ke volume media yang sama dengan aplikasi, dan
    # `storeMedia()` membuat sub-direktori scope (`euks/hero-logo`, dst.) secara
    # lazy lewat `mkdir -p`. Bila migrator berjalan sebagai root, sub-direktori
    # yang DIBUATNYA lebih dulu menjadi milik root:root dengan mode 0755 —
    # aplikasi (uid 1001) lalu gagal menulis unggahan BARU ke scope itu dengan
    # EACCES, walaupun /app/media sendiri sudah dimiliki nextjs:nodejs.
    # Kepemilikan /app/media di Dockerfile hanya melindungi direktori akar,
    # bukan sub-direktori yang lahir saat runtime.
    user: "1001:1001"
    environment:
      MEDIA_STORAGE_ROOT: /app/media
    volumes:
      - media:/app/media

volumes:
  # Nama ditulis eksplisit, bukan dibiarkan diturunkan dari nama project.
  # Tanpa `name:`, Docker menamai volume `<project>_media`, sehingga perubahan
  # nama project atau direktori deploy akan diam-diam membuat volume BARU yang
  # kosong — media lama tetap ada di disk tetapi tidak lagi ter-mount.
  #
  # Volume database sengaja TIDAK disentuh overlay ini: ia tetap bind mount
  # /var/lib/sismepda/postgresql milik `deploy.yaml`.
  media:
    name: sismepda_media_data
