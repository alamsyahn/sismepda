services:
  migrate:
    profiles: ["migration"]
    build:
      context: .
      target: migrator
    restart: "no"
    # Normal deploy hanya migrasi. Seed dijalankan terpisah dan eksplisit saat
    # bootstrap database baru; lihat docs/operations/deployment.md.
    command: ["sh", "-c", "npx prisma migrate deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    networks: [database]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${DOMAIN}
      NEXTAUTH_URL: https://${DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [database]

networks:
  database:
    external: true
    name: sismepda-dashboard_internal
