services:
  postgres:
    image: postgres:16
    container_name: sismepda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sismepda_user
      POSTGRES_PASSWORD: sismepda_password
      POSTGRES_DB: sismepda_db
    ports:
      - "5433:5432"
    volumes:
      - sismepda_postgres_data:/var/lib/postgresql/data

volumes:
  sismepda_postgres_data: